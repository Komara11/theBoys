<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 class="title animate__animated animate__fadeInDown">Hallo gua boys.</h1>
            <img class="model animate__animated animate__fadeInDown" src="model.png" alt="">
            <h1 id="question" class="animate__animated animate__fadeInUp"></h1>
            <div class="wrapper">
                <input type="text" id="answer" class="animate__animated animate__fadeInUp" placeholder="Input Answer">
            </div>
            <button onclick="botStart()" class="animate__animated animate__fadeInUp">send</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
